<!doctype html>
<html lang="en" class="at-top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric Koegler</title>
  <!-- favicon: the ☀️ sun from Noto Color Emoji (Apache License 2.0), as images
       so it looks the same everywhere. favicon.ico is the one browsers ask for
       by default; the larger PNG is for sharp screens; apple-touch-icon is for
       home-screen shortcuts (Android browsers often use it too). All transparent. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/habibi-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Scroll track: its height sets how long the animation lasts.
       The stage inside sticks to the screen while you scroll through it. -->
  <div class="track" id="track">
    <div class="stage">
      <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a9cde9"/>
            <stop offset="0.65" stop-color="#f7e6bd"/>
          </linearGradient>
          <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#231c45"/>
            <stop offset="0.35" stop-color="#6b2f6e"/>
            <stop offset="0.55" stop-color="#d1496b"/>
            <stop offset="0.65" stop-color="#f7934c"/>
          </linearGradient>

          <radialGradient id="sunFill" cx="0.5" cy="0.5" r="0.7">
            <stop offset="0" stop-color="#fff7d1"/>
            <stop offset="0.5" stop-color="#ffc35a"/>
            <stop offset="1" stop-color="#ff8a3d"/>
          </radialGradient>
          <radialGradient id="sunFillDusk" cx="0.5" cy="0.5" r="0.7">
            <stop offset="0" stop-color="#ffd27a"/>
            <stop offset="0.6" stop-color="#ff6a3d"/>
            <stop offset="1" stop-color="#e2384f"/>
          </radialGradient>
          <!-- egg scene only: the yolk (same shape as the sun, lighter true yellow) -->
          <radialGradient id="yolkFill" cx="0.5" cy="0.5" r="0.7">
            <stop offset="0" stop-color="#fff6c2"/>
            <stop offset="0.5" stop-color="#ffdc45"/>
            <stop offset="1" stop-color="#f7b500"/>
          </radialGradient>
          <radialGradient id="glow">
            <stop offset="0" stop-color="#ffb35c" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Layers are painted bottom to top -->
        <rect id="paper" width="1600" height="1000" fill="#f4efe6"/>
        <rect id="skyDayLayer"  width="1600" height="1000" fill="url(#skyDay)"  opacity="0"/>
        <rect id="skyDuskLayer" width="1600" height="1000" fill="url(#skyDusk)" opacity="0"/>
        <!-- egg scene only: darker cream that fades in over the opening cream -->
        <rect id="eggBg" class="egg-bg" width="1600" height="1000" fill="#ddd3c3" opacity="0"/>

        <!-- The "world": sun, mountains and egg scene, lifted together so the sun
             sits a bit above the middle of the screen (the amount is SCENE_LIFT in
             script.js, which sets this transform). -->
        <g id="world" transform="translate(0 -150)">
          <!-- The sun stays put on screen; the mountains rise over it -->
          <g id="sun" transform="translate(800 500)">
            <circle id="sunGlow"     r="600" fill="url(#glow)"        opacity="0"/>
            <circle id="sunBody"     r="220" fill="url(#sunFill)"     opacity="0"/>
            <circle id="sunBodyDusk" r="220" fill="url(#sunFillDusk)" opacity="0"/>
            <circle id="sunOutline"  r="220" fill="none" stroke="#2a2420" stroke-width="3"/>
          </g>

          <!-- Mountain layers, far → near. Each is one flat colour, lighter = further away.
               Shapes come from ranges.js ("mountains") and peaks.js (tools/peaks/skyline.py);
               slide-in and colours are set in script.js. -->
          <path id="mtFar"  fill="#a7b3cc" transform="translate(0 650)"/>
          <path id="mtMid"  fill="#7d84a3" transform="translate(0 500)"/>
          <path id="mtNear" fill="#4f4f6e" transform="translate(0 380)"/>
          <!-- "egg" scene's egg white: a parallax layer like the mountains (shape set
               from the egg entry in script.js). It moves a bit faster than the
               skillet, so it starts hidden behind the pan and rises out of it. -->
          <path id="eggWhite" fill="#ffffff"/>

          <!-- "egg" scene (joke option at the end of the menu): a skillet on a gas
               range's grate, and the sun is the yolk. The background stays the
               opening cream. Drawn at its resting place; it rises as one piece
               with the ground (the stovetop). -->
          <g id="eggScene" transform="translate(0 300)">
            <!-- background-coloured patch under the pan: keeps the yolk from showing through the grate -->
            <rect class="egg-bg" x="330" y="500" width="940" height="48" fill="#ddd3c3"/>
            <!-- burner head (no flame) -->
            <path fill="#3b3742" d="M 735 545 L 740 528 Q 742 524 748 524 L 852 524 Q 858 524 860 528 L 865 545 Z"/>
            <rect x="745" y="519" width="110" height="6" rx="3" fill="#5a5562"/>
            <!-- steel grate: support prongs up to the pan, on a rail along the stovetop -->
            <g fill="#5a5562">
              <path d="M 404 512 L 426 512 L 430 532 L 400 532 Z"/>
              <path d="M 604 512 L 626 512 L 630 532 L 600 532 Z"/>
              <path d="M 974 512 L 996 512 L 1000 532 L 970 532 Z"/>
              <path d="M 1174 512 L 1196 512 L 1200 532 L 1170 532 Z"/>
              <rect x="320" y="530" width="960" height="16" rx="3"/>
            </g>
            <rect x="320" y="530" width="960" height="3" rx="1.5" fill="#78727f"/>
            <!-- skillet: handle (its inner end tucks behind the pan's side), side, rim -->
            <path fill="#1b161f" d="M 1255 446 L 1640 410 L 1640 446 L 1255 490 Z"/>
            <path fill="#1b161f" d="M 290 456 L 1310 456 L 1262 504 Q 1255 512 1243 512 L 357 512 Q 345 512 338 504 Z"/>
            <path fill="#1b161f" d="M 270 448 Q 270 442 278 442 L 1322 442 Q 1330 442 1330 448 L 1330 452 Q 1330 458 1322 458 L 278 458 Q 270 458 270 452 Z"/>
          </g>

          <!-- Nearest layer = the ground; its colour must match --earth in style.css -->
          <path id="ground" fill="#2a2232" transform="translate(0 300)"/>
        </g>
      </svg>

      <p class="hint" id="hint">scroll
        <!-- drawn arrow (the ↓ character is a hairline in some fonts) -->
        <svg class="hint-arrow" viewBox="0 0 12 16" aria-hidden="true">
          <path d="M6 1.5v12M1.75 9.5 6 13.75l4.25-4.25" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </p>
    </div>

    <!-- Mountain range menu. It sits at the bottom of the scroll track, so it
         rides up with the ground (which moves at page speed) and comes to rest
         on it as the sunset finishes. Options are filled in by script.js. -->
    <select class="range-menu" id="rangeMenu" aria-label="Mountain range"></select>

    <!-- Your name and links. They sit on the ground at the bottom of the scroll
         track (like the range menu), so they rise with the ground, and the page
         ends exactly when the sun has set. -->
    <main class="earth">
      <div class="content">
        <h1>Eric Koegler</h1>
        <!-- Phrases live in taglines.js; script.js rotates them. script.js also adds
             an invisible copy of every phrase here, stacked in the same spot, so the
             box is always as tall as the longest one needs at this screen width. -->
        <div class="tagline-box">
          <p class="tagline" id="tagline">it was cloudy, but i used my imagination.</p>
        </div>
        <ul class="links">
          <li class="has-popup">
            <button type="button" class="link-button popup-trigger" aria-expanded="false" aria-controls="blogPopup">blog</button>
            <span class="info-popup" id="blogPopup" hidden>coming soon</span>
          </li>
          <li><a href="https://github.com/ermako">github</a></li>
          <li><a href="https://www.peakbagger.com/climber/climber.aspx?cid=47973">peakbagger</a></li>
          <li class="has-popup">
            <button type="button" class="link-button popup-trigger" aria-expanded="false" aria-controls="contactPopup">contact</button>
            <span class="info-popup" id="contactPopup" hidden>eric dot koegler at outlook dot com</span>
          </li>
          <li><button type="button" class="link-button" id="nextTagline" aria-label="next tagline">next</button></li>
        </ul>
      </div>
    </main>
  </div>


  <script src="ranges.js"></script>
  <script src="peaks.js"></script>
  <script src="taglines.js"></script>
  <script src="script.js"></script>
</body>
</html>
